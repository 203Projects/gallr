version: 2

updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    ignore:
      # composeApp pins the MapLibre SDK to the exact version maplibre-compose was built against;
      # it moves only together with a maplibre-compose release that requires it (PR #258).
      - dependency-name: "org.maplibre.gl:android-sdk"
        update-types: ["version-update:semver-major"]
    groups:
      compatible-gradle-updates:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    groups:
      compatible-npm-updates:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /admin
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    groups:
      compatible-npm-updates:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /gallery
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    groups:
      compatible-npm-updates:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    groups:
      compatible-action-updates:
        patterns: ["*"]
        update-types: [minor, patch]
