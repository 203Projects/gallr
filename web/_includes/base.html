<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>gallr — Discover Art Exhibitions Near You</title>
  <meta name="description" content="gallr helps you discover ongoing and upcoming art and cultural exhibitions in your city. Bookmark favourites and filter by region, opening dates, and editor's picks." />

  <!-- Open Graph -->
  <meta property="og:title" content="gallr — Discover Art Exhibitions Near You" />
  <meta property="og:description" content="Discover ongoing and upcoming art and cultural exhibitions in your city." />
  <meta property="og:type" content="website" />

  <!-- Preload critical above-the-fold font (Inter Bold 700) -->
  <link rel="preload" as="font" type="font/woff2"
        href="/fonts/inter-700.woff2" crossorigin />

  <!-- Design tokens (color, typography, spacing) -->
  <link rel="stylesheet" href="/styles/tokens.css" />

  <!-- Section styles -->
  <link rel="stylesheet" href="/styles/main.css" />

  <noscript>
    <style>
      [data-reveal], [data-reveal-stagger] > * { opacity: 1 !important; transform: none !important; }
    </style>
  </noscript>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <script defer src="/scripts/main.js"></script>
</head>
<body>
  <!-- Skip navigation for keyboard/screen reader users -->
  <a class="skip-link" href="#main-content" lang="en">Skip to main content</a>

  <header class="site-header">
    <div class="site-header__inner">
      <a href="/" class="site-logo" aria-label="gallr — home">
        <img src="/logos/b-arch-pin.svg" width="28" height="28" alt="" aria-hidden="true" class="site-logo__mark"/>
        <span class="site-logo__wordmark">gallr</span>
      </a>
      <nav class="site-nav" aria-label="Primary">
        <a href="/exhibitions/" class="site-nav__link">
          전시 <span class="bi-en" lang="en">EXHIBITIONS</span>
        </a>
        <a href="/map/" class="site-nav__link">
          지도 <span class="bi-en" lang="en">MAP</span>
        </a>
        <a href="/about/" class="site-nav__link">
          소개 <span class="bi-en" lang="en">ABOUT</span>
        </a>
      </nav>
      <a href="#downloads" class="site-header__cta" lang="ko">다운로드</a>
    </div>
    <div class="site-header__progress" aria-hidden="true"></div>
  </header>

  <main id="main-content">
    {{ content | safe }}
  </main>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <div class="site-footer__columns">
        <div class="site-footer__column">
          <h2 class="site-footer__heading" lang="en">gallr</h2>
          <p class="site-footer__brand-line">도시의 전시를 한곳에.</p>
        </div>
        <div class="site-footer__column">
          <h3 class="site-footer__heading" lang="en">DOWNLOAD</h3>
          <ul class="site-footer__list">
            <li><a href="{{ site.appStoreUrl }}">App Store</a></li>
            <li><a href="{{ site.googlePlayUrl }}">Google Play</a></li>
          </ul>
        </div>
        <div class="site-footer__column">
          <h3 class="site-footer__heading" lang="en">COMPANY</h3>
          <ul class="site-footer__list">
            <li><a href="#about">About</a></li>
            <li><a href="/privacy/">Privacy</a></li>
          </ul>
        </div>
        <div class="site-footer__column">
          <h3 class="site-footer__heading" lang="en">CONTACT</h3>
          <ul class="site-footer__list">
            <li><a href="mailto:hello@gallrmap.com">hello@gallrmap.com</a></li>
            <li><a href="https://instagram.com/gallr.app">Instagram</a></li>
          </ul>
        </div>
      </div>
      <div class="site-footer__bottom">
        <p class="site-footer__copy">&copy; 2026 gallr</p>
        <p class="site-footer__location" lang="en">Made in Seoul</p>
      </div>
    </div>
  </footer>
</body>
</html>
