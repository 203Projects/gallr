version: 2

updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    ignore:
      # The map library is pre-1.0: minor releases change its API and the native runtime it pairs
      # with, and a wrong pairing passes CI and fails only on a device. Upgrade it by hand with
      # the device check in CLAUDE.md; patch releases still arrive here.
      - dependency-name: "org.maplibre.compose:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      compatible-gradle-updates:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    groups:
      compatible-npm-updates:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /admin
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    groups:
      compatible-npm-updates:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /gallery
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    groups:
      compatible-npm-updates:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    groups:
      compatible-action-updates:
        patterns: ["*"]
        update-types: [minor, patch]
