name: Database tests

on:
  pull_request:
    paths:
      - ".gitattributes"
      - ".github/workflows/database-tests.yml"
      - ".node-version"
      - "supabase/config.toml"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "scripts/staging-rehearsal/**"
      - "scripts/legacy-mobile-mirror/**"
      - "web/scripts/fetch-exhibitions.js"
      - "web/tests/fetch-exhibitions.test.js"
      - "web/tests/fetch-exhibitions.integration.test.js"
      - "web/tests/fetch-exhibitions.integration-harness.test.js"
  workflow_dispatch:

concurrency:
  group: database-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  database-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install pinned terminal test dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends expect=5.45.4-3

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.109.1

      - name: Validate canonical migration lineage
        run: |
          node scripts/staging-rehearsal/lib/validate-migration-lineage.mjs
          node --test scripts/staging-rehearsal/lib/validate-migration-lineage.test.mjs

      - name: Test database target validation and safe psql transport
        run: |
          node --test \
            scripts/staging-rehearsal/lib/validate-database-target.test.mjs \
            scripts/staging-rehearsal/lib/run-psql-with-validated-target.test.mjs
          node scripts/staging-rehearsal/lib/validate-target-identity-policy.test.mjs

      - name: Run network-free staging safety suites
        run: |
          node --test scripts/legacy-mobile-mirror/legacy-mobile-mirror.test.mjs
          bash scripts/staging-rehearsal/lib/reviewed-toolchain.test.sh
          bash scripts/staging-rehearsal/tests/run-safe-bash.test.sh
          bash scripts/staging-rehearsal/tests/preflight-environment.test.sh
          bash scripts/staging-rehearsal/tests/target-identity-guard.test.sh
          bash scripts/staging-rehearsal/tests/install-disposable-clone-marker.test.sh
          bash scripts/staging-rehearsal/tests/database-evidence-chain.test.sh
          bash scripts/staging-rehearsal/tests/anonymous-access-checks.test.sh
          bash scripts/staging-rehearsal/tests/migration-writer-probe.test.sh
          bash scripts/staging-rehearsal/tests/postgrest-evidence-toolchain.test.sh
          node web/tests/fetch-exhibitions.test.js
          node web/tests/fetch-exhibitions.integration-harness.test.js
          bash scripts/staging-rehearsal/fixtures/tests/guards.test.sh
          bash scripts/staging-rehearsal/fixtures/tests/lifecycle.test.sh
          bash scripts/staging-rehearsal/concurrency/tests/guards.test.sh

      - name: Create loopback-only Docker network
        run: |
          docker network create \
            --driver bridge \
            --opt com.docker.network.bridge.host_binding_ipv4=127.0.0.1 \
            gallr-supabase-ci

      - name: Start clean database from migrations
        run: supabase db start --network-id gallr-supabase-ci

      - name: Prove database port is loopback-only
        run: |
          bindings="$(docker port supabase_db_gallr 5432/tcp)"
          if [ "$bindings" != "127.0.0.1:55322" ]; then
            echo "Unsafe database port binding: $bindings" >&2
            exit 1
          fi

      - name: Prove real libpq routing semantics
        run: >-
          docker exec -i supabase_db_gallr bash -s
          < scripts/staging-rehearsal/lib/libpq-routing-regression.test.sh

      - name: Verify migration history
        run: supabase migration list --local --network-id gallr-supabase-ci

      - name: Run all pgTAP suites
        run: >-
          supabase test db supabase/tests/database
          --local
          --network-id gallr-supabase-ci

      - name: Lint database schemas
        run: >-
          supabase db lint
          --local
          --schema public,content,content_private
          --fail-on error
          --network-id gallr-supabase-ci

      - name: Run database security advisors
        run: >-
          supabase db advisors
          --local
          --type security
          --fail-on error
          --network-id gallr-supabase-ci

      - name: Run two-session catalog concurrency regression
        env:
          SUPABASE_DB_CONTAINER: supabase_db_gallr
        run: bash supabase/tests/exhibition_catalog_v2_concurrency.sh

      - name: Run explainable art metadata concurrency regression
        env:
          SUPABASE_DB_CONTAINER: supabase_db_gallr
        run: bash supabase/tests/explainable_art_metadata_concurrency.sh

      - name: Run public-site rebuild coalescing concurrency regression
        env:
          SUPABASE_DB_CONTAINER: supabase_db_gallr
        run: bash supabase/tests/public_site_rebuild_coalescing_concurrency.sh

      - name: Run two-session gallery alert concurrency regression
        env:
          SUPABASE_DB_CONTAINER: supabase_db_gallr
        run: bash supabase/tests/gallery_alert_installation_concurrency.sh

      - name: Run two-session gallery claim approval regression
        env:
          SUPABASE_DB_CONTAINER: supabase_db_gallr
        run: bash supabase/tests/gallery_claim_approval_concurrency.sh

      - name: Run two-session Gallery Launch activation regression
        env:
          SUPABASE_DB_CONTAINER: supabase_db_gallr
        run: bash supabase/tests/gallery_launch_activation_concurrency.sh

      - name: Run two-session My Gallr account archive regression
        env:
          SUPABASE_DB_CONTAINER: supabase_db_gallr
        run: bash supabase/tests/my_gallr_account_archive_concurrency.sh

      - name: Stop and remove disposable database
        if: always()
        run: |
          supabase stop \
            --no-backup \
            --network-id gallr-supabase-ci || true
          docker network rm gallr-supabase-ci || true
