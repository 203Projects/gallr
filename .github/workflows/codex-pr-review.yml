name: Codex pull request review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: codex-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  codex:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
      issues: write
    outputs:
      final_message: ${{ steps.run_codex.outputs.final-message }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GitHub may remove refs/pull/<number>/merge immediately after a PR
          # merges while an already-queued review job is still starting. The
          # event's immutable head SHA remains fetchable and represents the
          # exact revision the review was requested for.
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Pre-fetch base ref
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags origin \
            "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"

      - name: Run Codex
        id: run_codex
        continue-on-error: true
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e # v1.12
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/review.md
          output-file: codex-output.md
          model: gpt-5.3-codex
          effort: medium
          safety-strategy: drop-sudo
          sandbox: read-only

      - name: Record Codex review failure
        if: steps.run_codex.outcome == 'failure'
        run: |
          {
            echo "## Codex review did not complete"
            echo ""
            echo "The Codex Action failed before producing review output. Check the Run Codex logs for API quota, billing, or configuration errors."
          } >> "$GITHUB_STEP_SUMMARY"

  post_feedback:
    runs-on: ubuntu-24.04
    needs: codex
    if: needs.codex.outputs.final_message != ''
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Post Codex feedback
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CODEX_FINAL_MESSAGE: ${{ needs.codex.outputs.final_message }}
          CODEX_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const marker = '<!-- codex-pr-review -->';
            const body = [
              marker,
              `## Codex review for \`${process.env.CODEX_HEAD_SHA.slice(0, 7)}\``,
              '',
              process.env.CODEX_FINAL_MESSAGE,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const previous = comments.find((comment) =>
              comment.user.type === 'Bot' && comment.body.includes(marker)
            );

            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
