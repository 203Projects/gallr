<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  /* A white cube: works on one centre line, a hairline where the wall meets the floor. */
  body { background: var(--background); }
  .floor { position: absolute; left: 0; right: 0; top: 1440px; height: 2px; background: var(--outline-variant); }
  .work { position: absolute; }
  .work img { display: block; width: 100%; height: 100%; object-fit: cover; outline: 3px solid var(--on-background); outline-offset: -3px; }
  .label { position: absolute; top: calc(100% + 34px); left: 0; width: max(100%, 360px); font-size: 24px; line-height: 1.35; }
  .label .venue { font-weight: 500; color: var(--on-background); white-space: nowrap; }
  .label .title, .label .dates { color: var(--on-surface-variant); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body data-payload="{{payload}}">
  <div class="floor"></div>
  <script>
    const { works, shift } = JSON.parse(document.body.dataset.payload);
    for (const work of works) {
      const node = document.createElement('div');
      node.className = 'work';
      Object.assign(node.style, { left: `${work.x - shift}px`, top: `${work.y}px`, width: `${work.width}px`, height: `${work.height}px` });
      const image = document.createElement('img');
      image.src = work.cover;
      const label = document.createElement('div');
      label.className = 'label';
      for (const [kind, text] of [['venue', work.venue], ['title', work.title], ['dates', work.dates]]) {
        const line = document.createElement('div');
        line.className = kind;
        line.textContent = text;
        label.appendChild(line);
      }
      node.append(image, label);
      document.body.appendChild(node);
    }
  </script>
</body>
</html>
