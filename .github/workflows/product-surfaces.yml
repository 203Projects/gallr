name: Product surface tests

on:
  pull_request:
    paths:
      - ".github/workflows/product-surfaces.yml"
      - ".editorconfig"
      - ".node-version"
      - ".tool-versions"
      - "admin/**"
      - "gallery/**"
      - "web/**"
      - "supabase/config.toml"
      - "supabase/functions/**"
      - "scripts/product-surfaces/**"
      - "shared/**"
      - "composeApp/**"
      - "iosApp/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
  workflow_dispatch:

concurrency:
  group: product-surfaces-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  owner-and-staff-web:
    name: ${{ matrix.workspace }} workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        workspace: [admin, gallery]

    defaults:
      run:
        working-directory: ${{ matrix.workspace }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Type-check workspace
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build

  public-web:
    name: Public web
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run unit, build, accessibility, and browser suites
        run: npm test

  discover-edge-functions:
    name: Discover Edge functions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.functions.outputs.matrix }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test product configuration validator
        run: python3 scripts/product-surfaces/validate-config.test.py

      - name: Validate Auth and Edge Function boundaries
        run: python3 scripts/product-surfaces/validate-config.py

      - name: Build function matrix
        id: functions
        shell: python
        run: |
          import json
          import os
          import re
          from pathlib import Path

          configs = sorted(Path("supabase/functions").glob("*/deno.json"))
          functions = [path.parent.name for path in configs]
          if not functions:
              raise SystemExit("No Edge functions with deno.json were found.")
          invalid = [
              name for name in functions
              if not re.fullmatch(r"[a-z0-9]+(?:-[a-z0-9]+)*", name)
          ]
          if invalid:
              raise SystemExit(f"Invalid Edge function directory names: {invalid}")
          undocumented = [
              path.parent.name for path in configs
              if not (path.parent / "README.md").is_file()
          ]
          if undocumented:
              raise SystemExit(f"Edge functions missing README.md: {undocumented}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"matrix={json.dumps(functions)}\n")

  edge-functions:
    name: Edge / ${{ matrix.function }}
    needs: discover-edge-functions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        function: ${{ fromJSON(needs.discover-edge-functions.outputs.matrix) }}

    defaults:
      run:
        working-directory: supabase/functions/${{ matrix.function }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version-file: .tool-versions
          cache: true

      - name: Run function tests
        run: deno task test

      - name: Check formatting, lint, and types
        run: deno task check

  android-shared:
    name: Android and shared Kotlin
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-37.0"

      - name: Check Kotlin style and run unit tests
        run: ./gradlew shared:ktlintCheck composeApp:ktlintCheck androidApp:ktlintCheck shared:testAndroidHostTest composeApp:testAndroidHostTest androidApp:lintDebug

  ios-compile:
    name: iOS simulator compile
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Resolve iOS map SDK package
        run: xcodebuild -resolvePackageDependencies -project iosApp/iosApp.xcodeproj

      - name: Compile iOS simulator target
        run: ./gradlew composeApp:compileKotlinIosSimulatorArm64
